<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Wedding Invitation — Loading...</title>
  <script>
    (function() {
      try {
        var path = window.location.pathname;
        var parts = path.split('/');
        var file = parts[parts.length - 1] || '';
        var slug = file.replace('.html', '').toLowerCase();

        // 1. If path looks like a published invitation page
        if (path.includes('/published/') || file.endsWith('.html')) {
          var savedHtml = (slug && localStorage.getItem('wishlys_published_html_' + slug))
                       || localStorage.getItem('wishlys_published_html_latest')
                       || localStorage.getItem('wishlys_published_html');

          if (savedHtml) {
            document.open();
            document.write(savedHtml);
            document.close();
            return;
          }

          // If no localStorage, fallback to preeti-and-ashish.html or live SPA
          var basePath = path.includes('/wedding-invitation/') ? '/wedding-invitation/' : '/';
          if (slug && slug !== 'preeti-and-ashish') {
            window.location.replace(basePath + 'published/preeti-and-ashish.html');
            return;
          }
        }

        // 2. Default redirect to published page
        var basePath = path.includes('/wedding-invitation/') ? '/wedding-invitation/' : '/';
        window.location.replace(basePath + 'published/preeti-and-ashish.html');
      } catch (e) {
        window.location.replace('./published/preeti-and-ashish.html');
      }
    })();
  </script>
</head>
<body style="margin:0;padding:60px 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;background:#FAF7F2;color:#2B1E17;">
  <div style="max-width:400px;margin:0 auto;padding:30px;border-radius:24px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,0.06);">
    <h2 style="font-family:serif;font-size:24px;margin-bottom:8px;">Opening Invitation...</h2>
    <p style="font-size:13px;color:#78716c;margin-bottom:20px;">Connecting to your live wedding invitation.</p>
    <a href="./published/preeti-and-ashish.html" style="display:inline-block;padding:10px 20px;border-radius:12px;background:#8B6F47;color:#fff;text-decoration:none;font-weight:bold;font-size:12px;text-transform:uppercase;letter-spacing:1px;">View Invitation</a>
  </div>
</body>
</html>
