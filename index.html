    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%23120C0A%22 stroke=%22%23C8A055%22 stroke-width=%224%22/><text y=%2264%22 x=%2250%22 text-anchor=%22middle%22 font-family=%22Montserrat,sans-serif%22 font-size=%2246%22 fill=%22%23E6C88A%22 font-weight=%22700%22>P</text></svg>">
    <script>
      // Automatic GitHub Pages trailing-slash enforcer for repo root & occasion subpaths
      (function() {
        var host = window.location.hostname;
        var path = window.location.pathname;
        if (host.endsWith('github.io') && /(?:\/wedding-invitation|\/[a-z-]+-invitation)$/.test(path)) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();

      // Automatic GitHub Pages asset path resolver & self-healing error handler
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'IMG' || e.target.tagName === 'AUDIO' || e.target.tagName === 'SOURCE')) {
          var src = e.target.src || e.target.currentSrc;
          if (src) {
            var fixed = src;
            if (src.includes('github.io/images/')) {
              fixed = src.replace('github.io/images/', 'github.io/wedding-invitation/images/');
            } else if (src.includes('github.io/audio/')) {
              fixed = src.replace('github.io/audio/', 'github.io/wedding-invitation/audio/');
            } else if (/\/[a-z-]+-invitation\/(images|audio)\//.test(src)) {
              fixed = src.replace(/\/[a-z-]+-invitation\/(images|audio)\//, '/$1/');
            }
            if (fixed !== src && e.target.src !== fixed) {
              e.target.src = fixed;
            }
          }
        }
      }, true);
    </script>
  </head>
  <body class="bg-[#120C0A] text-[#FBF7F0] antialiased selection:bg-[#C8A055]/30 selection:text-[#FBF7F0]">

  </body>
